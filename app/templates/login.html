<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마트케어 로그인</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
  <main class="login-card">
    <div class="login-logo" aria-hidden="true">❤</div>
    <h1>스마트케어</h1>
    <p id="role-description">어르신 안부 확인 서비스</p>
    <form id="login-form">
      <label class="role-option"><input type="checkbox" id="worker-role" aria-controls="user-fields worker-fields"> 사회복지사로 로그인</label>
      <div id="user-fields">
        <label for="phone">전화번호</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" maxlength="13" required>
      </div>
      <div id="worker-fields" hidden>
        <label for="worker-id">아이디</label>
        <input id="worker-id" name="worker_id" autocomplete="username" disabled>
        <label for="worker-password">비밀번호</label>
        <input id="worker-password" name="worker_password" type="password" autocomplete="current-password" disabled>
      </div>
      <p id="login-error" role="alert"></p>
      <p id="login-status" role="status" aria-live="polite"></p>
      <button id="login-submit" type="submit">로그인</button>
    </form>
    <a id="register-link" href="/register/user">처음 오셨나요? 어르신 등록</a>
  </main>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
